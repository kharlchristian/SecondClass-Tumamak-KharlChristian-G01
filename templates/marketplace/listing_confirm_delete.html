{% extends "base.html" %}
{% block title %}Delete listing · SecondClass{% endblock %}
{% block content %}
<section class="profile-card">
  <p class="eyebrow">Confirm deletion</p>
  <h1>Delete “{{ listing.title }}”?</h1>
  <p class="muted">This permanently deletes the listing. This action cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button class="button button-primary" type="submit">Delete listing</button>
    <a class="text-link" href="{% url 'marketplace:listing_detail' listing.pk %}">Cancel</a>
  </form>
</section>
{% endblock %}
